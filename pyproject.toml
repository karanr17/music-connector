[project]
name = "music-connector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Raghwani", email = "111778465+karanr17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.1",
    "muq>=0.1.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "transformers>=4.46,<4.50",
    "typer>=0.29.2",
    "websockets>=17.4",
]

[project.scripts]
mc = "music_connector.cli:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
