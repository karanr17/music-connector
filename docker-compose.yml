services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music_connector
    ports:
      - "${MC_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music_connector"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
